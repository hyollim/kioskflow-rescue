<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KioskFlow responsive QA</title><style>body{font:14px system-ui;background:#F6F7F9;color:#202733;margin:0}nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;padding:16px}button{padding:10px 14px;background:white;color:#202733;border:1px solid #E5E9F0;border-radius:6px;cursor:pointer}p{font-size:14px;max-width:900px;margin:12px 16px;line-height:1.7}iframe{width:390px;height:844px;border:0;border-radius:0;background:white;display:block}strong{margin-right:15px}</style></head><body><nav><strong>실제 CSS 뷰포트 검증</strong><button data-width="390">모바일 390px</button><button data-width="768">태블릿 768px</button><button data-width="1440">데스크톱 1440px</button><button id="run-design-audit">현재 화면 검사</button><a href="./">앱으로 돌아가기</a></nav><p>같은 정적 앱을 지정 너비의 iframe에서 실행하는 QA 도구입니다. 모바일 OS·터치·스크린리더 에뮬레이션이나 실제 기기 인증은 아닙니다. 여러 탭 동기화 테스트 용도가 아닙니다.</p><p id="viewport-status" role="status">요청 너비 390px · 프레임 내부 수치는 로드 후 표시</p><pre id="audit-output" hidden></pre><iframe id="device" src="./" title="반응형 테스트 앱"></iframe><script>const frame=document.querySelector('#device'),status=document.querySelector('#viewport-status');function report(){try{const doc=frame.contentDocument;status.textContent=`요청 너비 ${frame.style.width||'390px'} · 실제 프레임 ${frame.contentWindow.innerWidth}px · 문서 너비 ${doc.documentElement.scrollWidth}px`; }catch{status.textContent='프레임 상태를 읽을 수 없습니다.'}}document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>{frame.style.width=button.dataset.width+'px';frame.style.height=button.dataset.width==='390'?'844px':'900px';requestAnimationFrame(report)}));frame.addEventListener('load',report);setInterval(report,1000);</script><script src="./qa-design-audit.js"></script></body></html>
